name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Base jetable propre au job ; identifiants de test, aucun secret.
    services:
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: budgetracker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d budgetracker"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/budgetracker
      JWT_SECRET: ci-only-jwt-secret-not-a-real-secret
      S3_ACCESS_KEY_ID: ci-minio
      S3_SECRET_ACCESS_KEY: ci-minio-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npm test -w @budgetracker/shared
      - run: npm run db:migrate -w api
      # MinIO pour les pièces jointes (un service ne peut pas recevoir la commande `server`).
      - run: >-
          docker run -d -p 9000:9000 -e MINIO_ROOT_USER=ci-minio -e MINIO_ROOT_PASSWORD=ci-minio-secret
          cgr.dev/chainguard/minio:latest@sha256:7df55d002b698e4494a131b848dd553361bbe58b7e19f62d9623c29af1ba9ccf server /data
          && timeout 30 sh -c 'until curl -sf http://localhost:9000/minio/health/live; do sleep 1; done'
      - run: npm test -w api
      - run: npm test -w web
      # Images Docker en E44.
