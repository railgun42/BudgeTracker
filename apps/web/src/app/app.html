<a class="skip-link" href="#main">Aller au contenu</a>

<header class="header">
  <a routerLink="/" class="brand">BudgeTracker</a>
  @if (session.user(); as user) {
    <nav class="nav" aria-label="Navigation principale">
      @for (link of links(); track link.path) {
        <a
          [routerLink]="link.path"
          routerLinkActive="active"
          ariaCurrentWhenActive="page"
          [routerLinkActiveOptions]="{ exact: link.exact }"
          >{{ link.label }}</a
        >
      }
    </nav>
    <a routerLink="/transactions/new" class="button">+ Transaction</a>
    <button type="button" class="link-button" (click)="logout()">
      Se déconnecter<span class="visually-hidden"> ({{ user.name }})</span>
    </button>
  }
</header>

<main id="main" tabindex="-1">
  <router-outlet />
</main>

<footer class="footer">
  <nav aria-label="Informations légales">
    <a routerLink="/mentions-legales">Mentions légales</a>
    <a routerLink="/confidentialite">Confidentialité</a>
    <a routerLink="/cgu">CGU</a>
  </nav>
</footer>
